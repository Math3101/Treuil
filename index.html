.wkt{min-width:640px}@media(max-width:600px){.wkt{min-width:0}.wkt.stack td{padding-inline-start:0}.wkt.stack td::before{float:none;display:block;width:auto;margin:0 0 4px;font-weight:700;color:var(--ink)}.wkt th.wk{width:auto;display:block;padding:10px 0 4px;border:0}}.wkt th,.wkt td{vertical-align:top;padding:8px;border-bottom:1px solid var(--line)}.wkt th.wk{white-space:nowrap;width:110px}.wkt tr.cur th,.wkt tr.cur td{background:#fff4c2;color:#111}.eline{margin:2px 0 6px}.en{font-weight:700;font-size:12px;display:block;margin-bottom:2px}.lc{display:inline-block;font-size:12px;font-weight:700;padding:3px 6px;border-radius:6px;margin:0 3px 3px 0;text-decoration:none;min-width:34px;text-align:center}

.lot{font-size:12px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:4px;padding:2px 4px;text-align:center}

{

const LOTK=['01','02','04','05','06','08','09','10','11','12','13A','13B','14','15','16','GBMP'];
const AMC={sols:'Sols (dalles, lino, colles, ragréage)',murs:'Enduits plâtre murs / allèges',plafond:'Enduits plâtre plafond',faience:'Colle de faïence',fc:'Fibres-ciment'};
const T=(id,lot,label,mode,w,am=[],so=false)=>({id,lot,label,mode,w,am,so});
const TPL={
 LOG:[T('L1','06','Menuiseries extérieures (dépose + pose)','count',5,['murs']),T('L2','01','Carottage façade cuisine','bin',1,['murs']),T('L3','13A','Chaudière → module thermique (MTA)','pct',5,['murs','plafond']),T('L4','13A','Ventilation (bouches, gaines, obturation)','pct',2,['murs','plafond','faience']),T('L5','13B','Robinetterie','pct',1),T('L7','12','Mise en conformité électrique','pct',3,['murs','plafond','faience']),T('L8','12','Attestation Consuel','bin',1),T('L9','08','Coffrages réseau chauffage cuisine','pct',1,['murs','plafond']),T('L10','08','Détalonnage des portes','bin',.5),T('L11','08','Porte palière (remplacement / ferme-porte)','bin',1),
  T('SB8','09','SdB · placo','pct',.5,['murs','plafond'],true),T('SB1','10','SdB · faïence','pct',.5,['faience','murs'],true),T('SB9','10','SdB · sol souple + seuil','pct',.5,['sols'],true),T('SB2','11','SdB · peinture murs','pct',.5,['murs'],true),T('SB3','10','SdB · plinthes','bin',.25,['sols'],true),T('SB4','13B','SdB · bac de douche','bin',.75,['sols','faience'],true),T('SB5','13B','SdB · paroi de douche','bin',.5,['faience'],true),T('SB6','13B','SdB · lavabo et mitigeur lavabo','bin',.25,['faience'],true),T('SB7','13B','SdB · mitigeur douche','bin',.25,['faience'],true)],
 PAL:[T('P1','09','Faux plafond acoustique palier','pct',1),T('P2','11','Peinture palier','pct',1),T('P3','12','Éclairage palier','pct',1)],
 HALL:[T('H1','06','Ensemble porte vitrée du hall','pct',2),T('H2','10','Revêtement de sol du hall','pct',1,['faience']),T('H3','11','Peinture du hall','pct',1,['faience']),T('H4','12','Éclairage, interphonie, contrôle d’accès','pct',2,['faience']),T('H5','08','Tableaux d’affichage','bin',.5)],
 ESC:[T('E1','10','Contremarches et nez de marche contrastés','pct',1),T('E2','11','Peinture cage d’escalier','pct',1),T('E3','12','Éclairage cage d’escalier','pct',1)],
 ASC:[T('S1','01','Gros œuvre / fondations ascenseur','pct',3),T('S2','02','Charpente métallique / gaine','pct',2),T('S3','14','Installation ascenseur PMR','pct',3),T('S4','14','Mise en service / contrôle','bin',1)],
 SS:[T('SS1','01','Démolitions / flocage sous-station','pct',2,['fc']),T('SS2','13A','Sous-station chauffage urbain','pct',3,['fc']),T('SS3','13A','Réseaux de chauffage en sous-sol','pct',2,['fc']),T('SS4','12','Électricité services généraux','pct',1,['fc'])],
 TOIT:[T('T1','04','Étanchéité toiture','pct',3,['fc']),T('T2','13A','Caissons VMC et réseaux en toiture','pct',2,['fc'])],
 FAC:[T('F1','05','Échafaudage monté','bin',1),T('F2','06','Dépose garde-corps','pct',1),T('F3','01','Carottages','pct',1),T('F4','13A','Colonnes chauffage / VMC','pct',2),T('F5','05','ITE + bardage','pct',4),T('F6','05','Échafaudage déposé','bin',1)],
 EXT:[T('X1','15','VRD','pct',3),T('X2','16','Paysage','pct',2),T('X3','01','Locaux vélos / ordures ménagères','pct',1)]
};

 Z[t+'-HALL']={id:t+'-HALL',kind:'HALL',tower:t,lvl:0,poly:'HALL',name:'Hall tour '+t};
 for(let n=1;n<=TOW[t];n++)Z[t+'-P'+n]={id:t+'-P'+n,kind:'PAL',tower:t,lvl:n,poly:'PAL',name:'Palier '+niv(n)+' tour '+t};
 for(const [k,kind,name] of [['ESC','ESC','Cage d’escalier'],['ASC','ASC','Ascenseur PMR'],['SS','SS','Sous-sol / caves'],['TOIT','TOIT','Toiture'],['F1','FAC','Façade 1 (haut du plan)'],['F2','FAC','Façade 2 (droite)'],['F3','FAC','Façade 3 (bas)'],['F4','FAC','Façade 4 (gauche)']])Z[t+'-'+k]={id:t+'-'+k,kind,tower:t,lvl:null,name:name+' · tour '+t};
}
Z.EXT={id:'EXT',kind:'EXT',tower:null,lvl:null,name:'Extérieurs (VRD, paysage, locaux)'};
for(const id in DATA.pc)if(Z[id])Z[id].pcam=DATA.pc[id];

/* ---------- État ---------- */

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

 if(b.dataset.upw){const id=b.dataset.upw;$('#pw-'+CSS.escape(id)).innerHTML=`<div class="btns" style="margin-top:6px"><input type="text" id="npw" inputmode="numeric" maxlength="4" placeholder="Nouveau code" style="max-width:150px"><button class="btn" data-gen2="1">Générer</button><button class="btn pri" data-upws="${esc(id)}">Valider</button></div>`;return}

 if(b.closest('#tabs')&&b.dataset.v){S.view=b.dataset.v;location.hash=S.view;render();return}

 if(b.dataset.st){S.draft.st=b.dataset.st;renderSheet();return}

 if(b.id==='sv'){const id=S.open,t=tOf(id,S.edit),d=S.draft,am=zoneAm(id),amT=am.st==='oui'&&t.am.some(c=>am.cats.includes(c));d.c=$('#cm').value.trim();
  if(amT&&S.cfg.amCheck&&!($('#amOk')||{}).checked){toast('Cochez « mode opératoire amiante appliqué » pour enregistrer.');return}

 if(b.dataset.sy){S.sy=b.dataset.sy;render();return}

document.addEventListener('change',async e=>{const el=e.target;
 if(el.id==='exLot'){S.exLot=el.value;return}
 if(el.id==='entSel'){S.pinEnt=el.value||null;S.pin='';S.pinMsg='';S.pinBad=false;try{localStorage.setItem('treuil-ent',S.pinEnt||'')}catch(x){}render();return}
 if(el.dataset.tf){const [i,j,f]=el.dataset.tf.split('|');const t=S.te.inter[+i].ts[+j];t[f]=el.type==='checkbox'?el.checked:f==='w'?Math.max(0,+el.value||0):el.value;if(f!=='label')render();return}
 if(el.dataset.tam){const [i,j,c]=el.dataset.tam.split('|');const t=S.te.inter[+i].ts[+j];const set=new Set(t.am||[]);const cs=c==='murs'?['murs','faience']:[c];cs.forEach(x=>el.checked?set.add(x):set.delete(x));if(c==='murs'&&el.checked)set.delete('faience'),set.add('faience');t.am=[...set];return}
 if(el.dataset.tn!==undefined){S.te.inter[+el.dataset.tn].n=el.value;return}
 if(el.id==='jEnt'){S.jEnt=el.value;render();return}
 if(el.id==='amL'){S.amLot=el.value;render();return}
 if(el.id==='hT'){S.hT=el.value;render();return}
 if(el.id==='hL'){S.hL=el.value;render();return}
 if(el.dataset.exl!==undefined){const t=S.exT||S.tower;S.exSel[t+el.dataset.exl]=el.checked;return}
 if(el.id==='amChk'){putCfg({...S.cfg,amCheck:el.checked});return}
 if(el.id==='aMen'){const v=Math.max(1,Math.min(12,parseInt(el.value)||1));saveAttrs(S.open,{men:v});return}
 if(el.id==='aAm'){saveAttrs(S.open,{am:el.value});return}
 if(el.id==='plPast'){S.plPast=el.checked;render();return}
 if(el.id==='plI'){const f=el.files[0];if(!f)return;const o=$('#plMsg');o.textContent='Lecture…';try{const X=await loadXlsx();const wb=X.read(await f.arrayBuffer(),{cellDates:false});const m=TP.parseWorkbook(X,wb);if(!m.tasks.length)throw new Error('aucune tâche trouvée');TP.compute(m,[]);if(await savePlan({model:m}))toast('Planning importé : '+m.tasks.length+' tâches, '+m.feries.length+' jours fériés.')}catch(x){o.textContent='Fichier illisible : '+errMsg(x)}el.value='';return}
 if(el.id==='xlI'){const f=el.files[0];if(!f)return;const o=$('#xlOut');o.textContent='Lecture…';try{const {res,unk}=await readSurvey(f);S.xl=res;const todo=res.filter(r=>r.st&&r.st!=='renovee'),ok=res.filter(r=>r.st==='renovee'),none=res.filter(r=>!r.st||r.st==='autre');
  o.innerHTML=`<div class="amw" style="margin-top:8px"><b>${res.length} logements trouvés</b> : ${todo.length} réfection(s) à faire, ${ok.length} déjà rénovée(s), ${none.length} sans réponse exploitable.${unk.length?' Lignes ignorées : '+esc(unk.join(', '))+'.':''}<br><b>À rénover :</b> ${esc(todo.map(r=>r.id).join(', '))||'aucun'}<br><b>Déjà rénovées :</b> ${esc(ok.map(r=>r.id).join(', '))||'aucune'}${none.length?'<br><b>Sans réponse :</b> '+esc(none.map(r=>r.id).join(', ')):''}</div><div class="btns" style="margin-top:6px"><button class="btn pri" id="xlGo">Appliquer à ces ${todo.length+ok.length} logements</button></div>`}catch(x){o.textContent='Fichier illisible : '+errMsg(x)}el.value='';return}
 if(el.id==='aSdb'){saveAttrs(S.open,{sdb:el.checked});return}
 if(el.id==='aPb'){saveAttrs(S.open,{plomb:el.value});return}
 if(el.id==='aEdl'){const v=el.value.trim();if(v&&!/^https:\/\//.test(v)){toast('Le lien doit commencer par https://');return}saveAttrs(S.open,{edl:v});return}
 if(el.id==='phI'){const fs=[...el.files].slice(0,6);if(!fs.length)return;toast('Envoi des photos…');try{for(const f of fs)S.draft.ph.push(await upPhoto(f));S.draft.c=($('#cm')||{}).value||S.draft.c;renderSheet()}catch(x){toast('Photo non enregistrée.')}return}

document.addEventListener('input',e=>{if(e.target.id==='rng'&&S.draft){S.draft.st='v';S.draft.v=+e.target.value;$('#pv').textContent=S.draft.v+' %'}if(e.target.id==='cm'&&S.draft)S.draft.c=e.target.value});
document.addEventListener('submit',async e=>{e.preventDefault();
 if(e.target.id==='offF'){const d=$('#oD').value,f=$('#oF').value;if(!d)return;if(f&&f<d){toast('La date de fin est avant la date de début.');return}await savePlan({off:planCfg().off.concat([{d,f:f||'',type:$('#oT').value,ent:$('#oE').value,note:$('#oN').value.trim().slice(0,80)}])});toast('Jours non travaillés ajoutés.');return}
 if(e.target.id==='entF'){const nom=$('#eN').value.trim(),pin=$('#eP').value.trim();if(!/^\d{4}$/.test(pin)){$('#entMsg').textContent='Le code doit comporter 4 chiffres.';return}const {error}=await sb.rpc('admin_create_entreprise',{p_nom:nom,p_pin:pin,p_role:$('#eR').value,p_lots:parseLots($('#eL').value),p_taches:parseTaches($('#eT').value)});if(error){$('#entMsg').textContent=errMsg(error);return}await loadEnt();render();const m=$('#entMsg');if(m){m.innerHTML=`<div class="amw">« ${esc(nom)} » créée avec le code <b>${esc(pin)}</b>. Notez-le et transmettez-le à l’entreprise.</div>`}return}

function loadXlsx(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const sc=document.createElement('script');sc.src='lib/xlsx.mini.min.js';sc.onload=()=>res(window.XLSX);sc.onerror=rej;document.head.appendChild(sc)})}
const nrm=x=>String(x??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
async function readSurvey(file){const X=await loadXlsx();const wb=X.read(await file.arrayBuffer(),{cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];const rows=X.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
 const hi=rows.findIndex(r=>r&&r.some(c=>nrm(c)==='n° logement'||nrm(c)==='n logement'));if(hi<0)throw new Error('colonne « n° logement » introuvable');const H=rows[hi].map(nrm);
 const ci=n=>H.findIndex(h=>h===n);const cL=H.findIndex(h=>h.startsWith('n') && h.includes('logement')),cC=ci('configuration sdb'),cE=ci('equipements sdb'),cD=ci('date de reponse');if(cC<0)throw new Error('colonne « configuration SDB » introuvable');
 const by={},unk=[];for(const r of rows.slice(hi+1)){if(!r)continue;const m=String(r[cL]??'').toUpperCase().match(/([ABCD])\s*-?\s*0*(\d{1,2})\b/);if(!m){if(r[cL])unk.push(String(r[cL]));continue}const id=m[1]+String(+m[2]).padStart(2,'0');if(!Z[id]){unk.push(String(r[cL]));continue}
  const conf=nrm(r[cC]);const d=r[cD] instanceof Date?r[cD]:null;const prev=by[id];if(!conf&&prev)continue;if(prev&&prev.conf&&d&&prev.d&&d<prev.d)continue;by[id]={conf,eq:String(r[cE]??'').trim(),d}}
 const res=[];for(const [id,v] of Object.entries(by)){const st=!v.conf?null:v.conf.includes('renovee')?'renovee':v.conf.includes('locataire')?'locataire':v.conf.includes('origine')?'origine':'autre';res.push({id,st,eq:v.eq,d:v.d})}
 return {res:res.sort((a,b)=>a.id.localeCompare(b.id)),unk}}
const SDBST={renovee:'déjà rénovée (Claircienne)',origine:'d’origine',locataire:'modifiée par le locataire',autre:'configuration non reconnue'};
async function pinKey(k){if(S.pinBusy||!S.pinEnt)return;try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}S.pinBad=false;S.pinMsg='';if(k==='⌫'){S.pin=(S.pin||'').slice(0,-1);render();return}if(!/^\d$/.test(k)||(S.pin||'').length>=4)return;S.pin=(S.pin||'')+k;render();
 if(S.pin.length===4){S.pinBusy=true;render();try{const {data,error}=await sb.rpc('pin_login',{p_id:S.pinEnt,p_pin:S.pin});if(error)throw error;
  if(!data||!data.ok){S.pinMsg=(data&&data.msg)||'Code incorrect.';S.pinBad=true;S.pin=''}else{const r=await sb.auth.signInWithPassword({email:data.email,password:data.password});if(r.error)throw r.error;S.pin='';S.pinMsg=''}}
  catch(e){S.pinMsg='Connexion impossible : '+errMsg(e);S.pin=''}finally{S.pinBusy=false;render()}}}
document.addEventListener('keydown',e=>{if(!S.session&&S.pinEnt&&!e.target.closest('input,textarea,select')){if(/^\d$/.test(e.key))pinKey(e.key);else if(e.key==='Backspace')pinKey('⌫')}});
try{S.pinEnt=localStorage.getItem('treuil-ent')||null}catch(e){}

render();
sb.auth.getSession().then(({data})=>{S.session=data.session;if(S.session)loadAll();else render()});
