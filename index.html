const INTER0=JSON.parse(JSON.stringify(INTER)),LOG0=JSON.parse(JSON.stringify(TPL.LOG));

 TPL.LOG=ts.map(t=>({id:String(t.id),lot:String(t.lot),label:String(t.label),mode:['pct','bin','count'].includes(t.mode)?t.mode:'pct',w:Math.max(0,+t.w||0),am:Array.isArray(t.am)?t.am.map(String):[],so:!!t.sdb,sdb:!!t.sdb}));
 INTER=it.map(g=>({n:String(g.n),t:(g.t||[]).map(String).filter(id=>TPL.LOG.some(x=>x.id===id))}));
 for(const k in TASKN)if(!TPL.PAL.concat(TPL.HALL,TPL.ESC,TPL.ASC,TPL.SS,TPL.TOIT,TPL.FAC,TPL.EXT).some(t=>t.id===k))delete TASKN[k];for(const t of TPL.LOG)TASKN[t.id]=t.label.replace(/^SdB · /,'SdB ').split(' (')[0];
 const order=INTER.flatMap(g=>g.t).concat(TPL.LOG.map(t=>t.id));LOGLOTS=[...new Set(order.map(id=>(TPL.LOG.find(t=>t.id===id)||{}).lot).filter(Boolean))]}
applyTaskConfig();
function entOfTask(t){const byT=(S.ent||[]).filter(e=>(e.taches||[]).includes(t.id));if(byT.length)return byT.map(e=>e.nom).join(', ');const byL=(S.ent||[]).filter(e=>(e.lots||[]).includes(t.lot));return byL.length?byL.map(e=>e.nom).join(', '):'Lot '+t.lot+' · entreprise non attribuée'}
function aggT(id,ts){let W=0,P=0,n=0,nr=0;for(const t of ts){const r=taskPct(id,t);if(!r)continue;W+=t.w;P+=t.w*r.p;n++;if(r.nr)nr++}return{p:W?P/W:0,n,nr}}
function groupedTasks(id,z,a){const all=TPL[z.kind].filter(t=>!(isSdb(t)&&!a.sdb&&!(doc(id).t||{})[t.id]));const out=[];
 const groups=z.kind==='LOG'?INTER.map(g=>({n:g.n,ts:g.t.map(k=>all.find(t=>t.id===k)).filter(Boolean)})):[{n:null,ts:all}];
 const used=new Set(groups.flatMap(g=>g.ts.map(t=>t.id)));const rest=all.filter(t=>!used.has(t.id));if(rest.length)groups.push({n:'Autres tâches',ts:rest});
 for(const g of groups){if(!g.ts.length)continue;const gk=g.n||'';const byE=new Map();for(const t of g.ts){const e=entOfTask(t);if(!byE.has(e))byE.set(e,[]);byE.get(e).push(t)}
  const open=!g.n||S.igOpen.has(gk)||g.ts.some(t=>t.id===S.edit);
  if(g.n){const r=aggT(id,g.ts);out.push({h:`<button class="ig" data-ig="${esc(gk)}" aria-expanded="${open}"><span><b>${esc(g.n)}</b><br><span class="igs">${(x=>x?'Prévu du '+fd(x.s)+' au '+fd(x.e)+' · RDV '+(r=>RDVST[r.st||'']+(r.st==='confirme'&&r.d?' '+fd({d:r.d})+(r.cr&&r.cr!=='j'?' '+CREN[r.cr].toLowerCase():''):''))(rdvOf(id,PH[INTER.findIndex(q=>q.n===g.n)]))+' · ':'')(z.kind==='LOG'?(planComp().byLog[id]||{})[PH[INTER.findIndex(q=>q.n===g.n)]]:null)}${esc([...byE.keys()].join(' · '))} · ${r.nr} non relevée(s) sur ${r.n}</span></span><span class="igp">${r.n&&r.nr===r.n?'—':pct(r.p)} <span aria-hidden="true">${open?'▾':'▸'}</span></span></button>`})}

 return out}

function loadJsPDF(){return new Promise((res,rej)=>{if(window.jspdf)return res(window.jspdf);const s=document.createElement('script');s.src='lib/jspdf.umd.min.js';s.onload=()=>res(window.jspdf);s.onerror=rej;document.head.appendChild(s)})}
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});

 if(k==='S')g.fillRect(.22,.66,.56,.14);else if(k==='V')g.fillRect(.43,.34,.14,.46);else{g.fillRect(.34,.42,.32,.1);g.lineWidth=.05;g.beginPath();g.moveTo(.5,.56);g.lineTo(.5,.78);g.moveTo(.42,.7);g.lineTo(.5,.78);g.lineTo(.58,.7);g.stroke()}g.restore()}

 if(b.id==='sv'){const id=S.open,t=tOf(id,S.edit),d=S.draft,am=zoneAm(id),amT=am.st==='oui'&&t.am.some(c=>am.cats.includes(c));d.c=$('#cm').value.trim();
  if(amT&&S.cfg.amCheck&&!($('#amOk')||{}).checked){toast('Cochez « mode opératoire amiante appliqué » pour enregistrer.');return}
  if(d.st==='nr'&&!(doc(id).t||{})[t.id]&&!t.so&&!d.c){toast('Rien à enregistrer.');return}
  b.disabled=true;const ok=await saveTask(id,t,d.st,d.v,d.c,d.ph,amT&&S.cfg.amCheck);if(ok){S.edit=null}renderSheet();return}
 if(b.dataset.sy){S.sy=b.dataset.sy;render();return}
 if(b.dataset.slt){S.slT=b.dataset.slt==='all'?'':b.dataset.slt;render();return}
 if(b.dataset.ext){S.exT=b.dataset.ext;render();return}
 if(b.id==='exAll'){const t=S.exT||S.tower;lvlList(t).forEach(n=>S.exSel[t+n]=true);render();return}
 if(b.id==='exGo'){doExport();return}

document.addEventListener('change',async e=>{const el=e.target;
 if(el.id==='exLot'){S.exLot=el.value;return}

 if(el.dataset.tf){const [i,j,f]=el.dataset.tf.split('|');const t=S.te.inter[+i].ts[+j];t[f]=el.type==='checkbox'?el.checked:f==='w'?Math.max(0,+el.value||0):el.value;if(f!=='label')render();return}
 if(el.dataset.tam){const [i,j,c]=el.dataset.tam.split('|');const t=S.te.inter[+i].ts[+j];const set=new Set(t.am||[]);const cs=c==='murs'?['murs','faience']:[c];cs.forEach(x=>el.checked?set.add(x):set.delete(x));if(c==='murs'&&el.checked)set.delete('faience'),set.add('faience');t.am=[...set];return}
 if(el.dataset.tn!==undefined){S.te.inter[+el.dataset.tn].n=el.value;return}
 if(el.id==='jEnt'){S.jEnt=el.value;render();return}
 if(el.id==='amL'){S.amLot=el.value;render();return}
 if(el.id==='hT'){S.hT=el.value;render();return}
 if(el.id==='hL'){S.hL=el.value;render();return}
 if(el.dataset.exl!==undefined){const t=S.exT||S.tower;S.exSel[t+el.dataset.exl]=el.checked;return}
 if(el.id==='amChk'){putCfg({...S.cfg,amCheck:el.checked});return}
 if(el.id==='aMen'){const v=Math.max(1,Math.min(12,parseInt(el.value)||1));saveAttrs(S.open,{men:v});return}
 if(el.id==='aAm'){saveAttrs(S.open,{am:el.value});return}
 if(el.dataset.cad){if(!S.cadEd)S.cadEd=JSON.parse(JSON.stringify(planCfg().model));const [i,k]=el.dataset.cad.split('|');const t=S.cadEd.tasks[+i];if(k==='imp')t.imp=el.value?TP.isoToNum(el.value):null;else t[k]=el.value===''?null:Math.max(0,+el.value);render();return}
 if(el.dataset.tpl){if(!S.cadEd)S.cadEd=JSON.parse(JSON.stringify(planCfg().model));const [i,k]=el.dataset.tpl.split('|');const x=S.cadEd.tpl[+i];x[k]=k==='lien'?el.value:Math.max(k==='dur'?0.5:0,+el.value||0);render();return}
 if(el.id==='plPdfP'){S.plP=el.value;return}
 if(el.id==='rvPer'){S.rvPer=el.value;render();return}
 if(el.id==='gT'||el.id==='gE'||el.id==='gL'){S[el.id]=el.value;S.gN=60;render();return}
 if(el.id==='rvS'){S.rvS=el.value;render();return}
 if(el.dataset.rvd){await setRdv(el.dataset.rvd,S.rvP||'P1',{d:el.value});return}
 if(el.dataset.rvc){await setRdv(el.dataset.rvc,S.rvP||'P1',{cr:el.value});return}
 if(el.dataset.rvp!==undefined&&el.dataset.rvp){await setRdv(el.dataset.rvp,S.rvP||'P1',{pr:el.value});return}
 if(el.dataset.rvn){await setRdv(el.dataset.rvn,S.rvP||'P1',{n:el.value.trim().slice(0,120)});return}
 if(el.id==='plNW'){S.plNW=+el.value;render();return}
 if(el.id==='plPast'){S.plPast=el.checked;render();return}
 if(el.id==='plI'){const f=el.files[0];if(!f)return;const o=$('#plMsg');o.textContent='Lecture…';try{const X=await loadXlsx();const wb=X.read(await f.arrayBuffer(),{cellDates:false});const m=TP.parseWorkbook(X,wb);if(!m.tasks.length)throw new Error('aucune tâche trouvée');TP.compute(m,[]);if(await savePlan({model:m,base:m}))toast('Planning importé : '+m.tasks.length+' tâches, '+m.feries.length+' jours fériés.')}catch(x){o.textContent='Fichier illisible : '+errMsg(x)}el.value='';return}
 if(el.id==='xlI'){const f=el.files[0];if(!f)return;const o=$('#xlOut');o.textContent='Lecture…';try{const {res,unk}=await readSurvey(f);S.xl=res;const kept=res.filter(r=>r.st&&r.st!=='autre'&&hasSdbInfo(r.id)),fresh=res.filter(r=>!hasSdbInfo(r.id)),todo=fresh.filter(r=>r.st&&r.st!=='renovee'&&r.st!=='autre'),ok=fresh.filter(r=>r.st==='renovee'),none=res.filter(r=>!r.st||r.st==='autre');
  o.innerHTML=`<div class="amw" style="margin-top:8px"><b>${res.length} logements trouvés</b> · nouveaux : ${todo.length} réfection(s) à faire, ${ok.length} déjà rénovée(s), ${none.length} sans réponse exploitable.${unk.length?' Lignes ignorées : '+esc(unk.join(', '))+'.':''}<br><b>À rénover :</b> ${esc(todo.map(r=>r.id).join(', '))||'aucun'}<br><b>Déjà rénovées :</b> ${esc(ok.map(r=>r.id).join(', '))||'aucune'}${none.length?'<br><b>Sans réponse :</b> '+esc(none.map(r=>r.id).join(', ')):''}${kept.length?`<br><b>Déjà renseignés, non modifiés (${kept.length}) :</b> ${esc(kept.map(r=>r.id).join(', '))}`:''}</div><p class="note">Seuls les logements sans information de salle de bain sont complétés ; les informations existantes ne sont jamais remplacées.</p>${todo.length+ok.length?`<div class="btns" style="margin-top:6px"><button class="btn pri" id="xlGo">Compléter ces ${todo.length+ok.length} logements</button></div>`:'<p class="mute">Aucun nouveau logement à compléter.</p>'}`}catch(x){o.textContent='Fichier illisible : '+errMsg(x)}el.value='';return}
 if(el.dataset.sdbst){if(prof.role!=='admin')return;askSdb(el.dataset.sdbst,el.value);return}
 if(el.id==='sdbF'){S.sdbF=el.value;render();return}
 if(el.id==='aPb'){saveAttrs(S.open,{plomb:el.value});return}
 if(el.id==='aEdl'){const v=el.value.trim();if(v&&!/^https:\/\//.test(v)){toast('Le lien doit commencer par https://');return}saveAttrs(S.open,{edl:v});return}
 if(el.id==='phI'){const fs=[...el.files].slice(0,6);if(!fs.length)return;toast('Envoi des photos…');try{for(const f of fs)S.draft.ph.push(await upPhoto(f));S.draft.c=($('#cm')||{}).value||S.draft.c;renderSheet()}catch(x){toast('Photo non enregistrée.')}return}
});
document.addEventListener('input',e=>{if(e.target.id==='rng'&&S.draft){S.draft.st='v';S.draft.v=+e.target.value;$('#pv').textContent=S.draft.v+' %'}if(e.target.id==='cm'&&S.draft)S.draft.c=e.target.value});
document.addEventListener('submit',async e=>{e.preventDefault();
 if(e.target.id==='offF'){const d=$('#oD').value,f=$('#oF').value;if(!d)return;if(f&&f<d){toast('La date de fin est avant la date de début.');return}await savePlan({off:planCfg().off.concat([{d,f:f||'',type:$('#oT').value,ent:$('#oE').value,note:$('#oN').value.trim().slice(0,80)}])});toast('Jours non travaillés ajoutés.');return}
 if(e.target.id==='entF'){const nom=$('#eN').value.trim(),pin=$('#eP').value.trim();if(!/^\d{4}$/.test(pin)){$('#entMsg').textContent='Le code doit comporter 4 chiffres.';return}const {error}=await sb.rpc('admin_create_entreprise',{p_nom:nom,p_pin:pin,p_role:$('#eR').value,p_lots:parseLots($('#eL').value),p_taches:parseTaches($('#eT').value)});if(error){$('#entMsg').textContent=errMsg(error);return}await loadEnt();render();const m=$('#entMsg');if(m){m.innerHTML=`<div class="amw">« ${esc(nom)} » créée avec le code <b>${esc(pin)}</b>. Notez-le et transmettez-le à l’entreprise.</div>`}return}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.open)closeSheet()});

function loadXlsx(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const sc=document.createElement('script');sc.src='lib/xlsx.mini.min.js';sc.onload=()=>res(window.XLSX);sc.onerror=rej;document.head.appendChild(sc)})}
const nrm=x=>String(x??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
async function readSurvey(file){const X=await loadXlsx();const wb=X.read(await file.arrayBuffer(),{cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];const rows=X.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
 const hi=rows.findIndex(r=>r&&r.some(c=>nrm(c)==='n° logement'||nrm(c)==='n logement'));if(hi<0)throw new Error('colonne « n° logement » introuvable');const H=rows[hi].map(nrm);
 const ci=n=>H.findIndex(h=>h===n);const cL=H.findIndex(h=>h.startsWith('n') && h.includes('logement')),cC=ci('configuration sdb'),cE=ci('equipements sdb'),cD=ci('date de reponse');if(cC<0)throw new Error('colonne « configuration SDB » introuvable');
 const by={},unk=[];for(const r of rows.slice(hi+1)){if(!r)continue;const m=String(r[cL]??'').toUpperCase().match(/([ABCD])\s*-?\s*0*(\d{1,2})\b/);if(!m){if(r[cL])unk.push(String(r[cL]));continue}const id=m[1]+String(+m[2]).padStart(2,'0');if(!Z[id]){unk.push(String(r[cL]));continue}
  const conf=nrm(r[cC]);const d=r[cD] instanceof Date?r[cD]:null;const prev=by[id];if(!conf&&prev)continue;if(prev&&prev.conf&&d&&prev.d&&d<prev.d)continue;by[id]={conf,eq:String(r[cE]??'').trim(),d}}
 const res=[];for(const [id,v] of Object.entries(by)){const st=!v.conf?null:v.conf.includes('renovee')?'renovee':v.conf.includes('locataire')?'locataire':v.conf.includes('origine')?'origine':'autre';res.push({id,st,eq:v.eq,d:v.d})}
 return {res:res.sort((a,b)=>a.id.localeCompare(b.id)),unk}}
const SDBST={renovee:'déjà rénovée (Claircienne)',origine:'d’origine',locataire:'modifiée par le locataire',autre:'configuration non reconnue'};
async function pinKey(k){if(S.pinBusy||!S.pinEnt)return;try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}S.pinBad=false;S.pinMsg='';if(k==='⌫'){S.pin=(S.pin||'').slice(0,-1);render();return}if(!/^\d$/.test(k)||(S.pin||'').length>=4)return;S.pin=(S.pin||'')+k;render();
 if(S.pin.length===4){S.pinBusy=true;render();try{const {data,error}=await sb.rpc('pin_login',{p_id:S.pinEnt,p_pin:S.pin});if(error)throw error;
  if(!data||!data.ok){S.pinMsg=(data&&data.msg)||'Code incorrect.';S.pinBad=true;S.pin=''}else{const r=await sb.auth.signInWithPassword({email:data.email,password:data.password});if(r.error)throw r.error;S.pin='';S.pinMsg=''}}
  catch(e){S.pinMsg='Connexion impossible : '+errMsg(e);S.pin=''}finally{S.pinBusy=false;render()}}}
document.addEventListener('keydown',e=>{if(!S.session&&S.pinEnt&&!e.target.closest('input,textarea,select')){if(/^\d$/.test(e.key))pinKey(e.key);else if(e.key==='Backspace')pinKey('⌫')}});
try{S.pinEnt=localStorage.getItem('treuil-ent')||null}catch(e){}

sb.auth.getSession().then(({data})=>{S.session=data.session;if(S.session)loadAll();else render()});
sb.auth.onAuthStateChange((ev,ses)=>{const was=S.session&&S.session.user.id;S.session=ses;if(!ses){S.me=null;S.docs={};S.ents=null;S.journal=null;setProf();closeSheet();render()}else if(was!==ses.user.id){loadAll()}});

setInterval(()=>{if(document.visibilityState==='visible'&&S.session&&!S.edit)loadAll()},180000);
if('serviceWorker' in navigator){let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload()});navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();setInterval(()=>r.update(),300000)}).catch(()=>{})}
}
